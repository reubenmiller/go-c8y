# cspell:disable
# SonarQube Cloud automatic analysis settings.
# https://docs.sonarsource.com/sonarqube-cloud/advanced-setup/automatic-analysis/
#
# Classify Go test files as test code instead of production code, so rules
# that only apply to production code, such as go:S3776 (cognitive
# complexity), are not reported for tests. Automatic analysis does not read
# rule-specific ignores (sonar.issue.ignore.multicriteria) from this file;
# those are set in the project settings on sonarcloud.io.
#
# SonarQube Cloud reads this file from the repository's default branch.

sonar.sources=.
#
# Generated code (zz_generated_* files and the generated models) repeats by
# design, so it is excluded from the analysis and does not dominate the
# duplication of new code.
sonar.exclusions=**/*_test.go,**/testdata/**,**/zz_generated*,pkg/c8y/jsonmodels/**

sonar.tests=.
sonar.test.inclusions=**/*_test.go
